resources:
  pipelines:
    documents:
      name: ${bundle.name}-documents
      catalog: ${var.catalog}
      schema: ${resources.schemas.rag.name}
      serverless: true
      channel: PREVIEW  # Databricks Runtime 18, which ai_prep_search needs
      libraries:
        - glob:
            include: ../src/confluence_rag/pipelines/*.py
      environment:
        dependencies:
          - markdownify
      configuration:
        catalog: ${var.catalog}
        schema: ${resources.schemas.rag.name}
        confluence_wiki_url: ${var.confluence_wiki_url}
        confluence_username: ${var.confluence_username}
        # Resolved from the secret scope by the pipeline; never in code or logs.
        confluence_api_token: "{{secrets/confluence/api-token}}"
        llm_endpoint: ${var.llm_endpoint}
