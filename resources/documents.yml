resources:
  pipelines:
    documents:
      name: ${bundle.name}-documents
      catalog: ${var.catalog}
      schema: ${resources.schemas.rag.name}
      serverless: true
      # PREVIEW runs Databricks Runtime 18, which ai_prep_search needs.
      channel: PREVIEW
      libraries:
        - notebook:
            path: ../src/confluence_rag/pipelines/documents.py
      environment:
        dependencies:
          - ../dist/*.whl
      configuration:
        catalog: ${var.catalog}
        schema: ${resources.schemas.rag.name}
