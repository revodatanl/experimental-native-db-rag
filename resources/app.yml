resources:
  experiments:
    traces:
      name: /Users/${workspace.current_user.userName}/${bundle.name}

  apps:
    chat:
      name: confluence-rag
      description: "Ask the wiki: a LangGraph agent with one search tool, behind Databricks' chat UI."
      source_code_path: ../
      permissions:
        - level: CAN_USE
          group_name: ${var.users}
      # The search runs as the signed-in user: Databricks forwards a token scoped to
      # vector search with each request, and Unity Catalog applies their privileges.
      user_api_scopes:
        - vector-search
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_EXPERIMENT_ID
            value_from: experiment
          - name: LLM_ENDPOINT
            value_from: llm
          - name: VECTOR_SEARCH_INDEX
            value: ${var.catalog}.${resources.schemas.rag.name}.chunks_index
      resources:
        - name: experiment
          experiment:
            experiment_id: ${resources.experiments.traces.id}
            permission: CAN_EDIT
        - name: llm
          serving_endpoint:
            name: databricks-claude-sonnet-4-6
            permission: CAN_QUERY
