# Step 4: chunk, merge, index, and one job that runs the whole funnel.
#
# The vector search endpoint is declared here. The index itself is created by
# src/index.py on the first run, because it cannot exist before its source
# table does. Sync is TRIGGERED: the index refreshes when the job asks, not
# continuously, so freshness equals the job's cadence and costs nothing between runs.
resources:
  vector_search_endpoints:
    vs:
      name: ${var.vector_search_endpoint}
      endpoint_type: STANDARD

  jobs:
    refresh:
      name: ${bundle.name}-refresh
      tasks:
        - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.ingest.id}

        - task_key: documents
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.documents.id}

        - task_key: index
          depends_on:
            - task_key: documents
          notebook_task:
            notebook_path: ../src/index.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.rag.name}
              vector_search_endpoint: ${resources.vector_search_endpoints.vs.name}
              embedding_endpoint: ${var.embedding_endpoint}
              app_name: ${resources.apps.chat.name}

      # Nightly, shipped paused: unpause in the Jobs UI when the wiki should stay fresh.
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: Europe/Amsterdam
        pause_status: PAUSED
