# Step 4: the vector search endpoint, and one job that runs the whole funnel.
#
# The index itself is created by src/confluence_rag/index.py on the first run,
# because it cannot exist before its source table does. Sync is TRIGGERED: the
# index refreshes when the job asks, so freshness equals the job's cadence.
resources:
  vector_search_endpoints:
    vs:
      name: confluence-rag
      endpoint_type: STANDARD

  jobs:
    refresh:
      name: ${bundle.name}-refresh
      environments:
        - environment_key: serverless
          spec:
            client: "4"
      tasks:
        - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.ingest.id}

        - task_key: documents
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.documents.id}

        - task_key: index
          depends_on:
            - task_key: documents
          environment_key: serverless
          spark_python_task:
            python_file: ../src/confluence_rag/index.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${resources.schemas.rag.name}
              - --vector-search-endpoint
              - ${resources.vector_search_endpoints.vs.name}
              - --app-name
              - ${resources.apps.chat.name}

      # Nightly, shipped paused: unpause in the Jobs UI when the wiki should stay fresh.
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: Europe/Amsterdam
        pause_status: PAUSED
