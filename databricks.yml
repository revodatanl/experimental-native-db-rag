bundle:
  name: native-db-rag
  databricks_cli_version: ">= 1.3.0"

include:
  - resources/*.yml

# Built at deploy time; the refresh job installs it, so its notebook imports confluence_rag.
artifacts:
  confluence_rag:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog that holds everything this bundle creates.
    default: main
  schema:
    description: Schema for the raw Confluence tables and everything derived from them.
    default: confluence_rag
  confluence_connection:
    description: Name of the Unity Catalog connection of type Confluence (created once in Catalog Explorer).
    default: confluence
  llm_endpoint:
    description: Model serving endpoint that answers questions.
    default: databricks-claude-sonnet-4-6

targets:
  dev:
    mode: development
    default: true
