bundle:
  name: native-db-rag
  databricks_cli_version: ">= 1.3.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds everything this bundle creates.
    default: main
  schema:
    description: Schema for the raw Confluence tables and everything derived from them.
    default: confluence_rag
  confluence_connection:
    description: Name of the Unity Catalog connection of type Confluence (created once in Catalog Explorer).
    default: confluence
  confluence_wiki_url:
    description: Base URL of the wiki, used to download attachments, e.g. https://<site>.atlassian.net/wiki
    default: https://CHANGE-ME.atlassian.net/wiki
  confluence_username:
    description: Atlassian account email that the API token belongs to.
    default: CHANGE-ME@example.com
  secret_scope:
    description: Databricks secret scope holding the Confluence API token.
    default: confluence
  secret_key:
    description: Key of the API token inside the secret scope.
    default: api-token
  vision_endpoint:
    description: Model serving endpoint that describes images.
    default: databricks-claude-sonnet-4-6

targets:
  dev:
    mode: development
    default: true
