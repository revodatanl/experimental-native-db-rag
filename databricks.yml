bundle:
  name: native-db-rag
  databricks_cli_version: ">= 1.3.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds everything this bundle creates.
    default: main
  schema:
    description: Schema for the raw Confluence tables and everything derived from them.
    default: confluence_rag
  confluence_wiki_url:
    description: Base URL of the wiki, used to download attachments, e.g. https://<site>.atlassian.net/wiki
  confluence_username:
    description: Atlassian account email that the API token in secret scope `confluence` belongs to.
  llm_endpoint:
    description: Model serving endpoint that describes images and answers questions.
    default: databricks-claude-sonnet-4-6

targets:
  dev:
    mode: development
    default: true
