[project]
name = "native-db-rag"
version = "0.1.0"
description = "Chat with your Confluence wiki on Databricks, built from native building blocks only."
readme = "README.md"
requires-python = ">=3.12"
# Only what the agent server imports directly. Everything else is transitive.
dependencies = [
    "databricks-langchain>=0.20.0",
    "databricks-sdk>=0.140.0",
    "langchain>=1.4.0",
    "mlflow>=3.16.0",
]

[project.scripts]
start-app = "confluence_rag.app:main"
start-server = "confluence_rag.agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_rag"]

[tool.ruff]
line-length = 120
builtins = ["spark"]  # provided by the pipeline runtime in src/confluence_rag/pipelines

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
pydocstyle.convention = "google"
